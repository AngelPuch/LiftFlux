name: Admin Windows CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-windows:
    name: Admin Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore apps/admin-windows/LiftFlux.Admin.csproj --locked-mode
      - name: Build
        run: dotnet build apps/admin-windows/LiftFlux.Admin.csproj --no-restore --configuration Release -warnaserror
